name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save playwright && npx playwright install --with-deps chromium
      - run: npm run smoke -- --shots=./shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: shots
